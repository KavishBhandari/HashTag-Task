services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    #environment:
      #- PORT=3000
      #- MONGODB_URI=mongodb://mongo:27017/your_database_name
    env_file:
      - .env
    depends_on:
      #- mongo
      mongo:
        condition: service_healthy # <-- App tabhi start hoga jab mongo healthy ho jayega

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
     # ---> MongoDB ke liye Healthcheck add kiya <---
    healthcheck:
      test: echo "db.runCommand('ping').ok" | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
    mongo_data:
